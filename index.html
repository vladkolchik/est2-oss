<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EST2 — LLM-driven Post-Apocalyptic RPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'VT323', monospace;
        background-color: #111;
        color: #15ff00;
        font-size: 22px;
      }
      /* Custom scanlines effect */
      body::after {
        content: " ";
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        z-index: 10000;
        background-size: 100% 2px, 3px 100%;
        pointer-events: none;
        opacity: 0.4; /* Removed flicker animation for a stable view */
      }
      .text-glow {
        text-shadow: 0 0 4px #15ff00, 0 0 8px #15ff00;
      }
      /* Custom scrollbar for the terminal feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #080808;
        border-left: 1px solid #1a4d13;
      }
      ::-webkit-scrollbar-thumb {
        background: #15ff00;
        box-shadow: 0 0 5px #15ff00;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3aff28;
      }
      /* Fade-in animation for images */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.8s ease-in-out;
      }
    </style>

}
